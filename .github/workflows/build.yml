# Builds VentureMap on GitHub's cloud Macs every time code is pushed to
# main or a pull request opens against main. The build proves the app
# compiles; it does not sign anything and it does not run on a device.
#
# Why this shape:
# - `macos-latest` always has the newest Xcode, which is what the app
#   needs (it targets iOS 27).
# - `-target VentureMap` builds the app target directly, so no shared
#   Xcode scheme file is needed.
# - `-sdk iphoneos` picks the iPhone SDK. `-destination` does NOT work
#   here: without a scheme, xcodebuild ignores the destination entirely
#   and builds for macOS instead, which fails on every iOS-only API.
#   (Proven by the first run of this workflow, 2026-11-17: 23 errors,
#   all iOS-only API missing on macOS, because the destination was
#   ignored.) Building for the device SDK needs no simulator.
# - `CODE_SIGNING_ALLOWED=NO` skips code signing, which a cloud build
#   cannot do without certificates.
#
# Minutes come from the repository owner's GitHub account. The free tier
# covers a class project: macOS minutes count tenfold, and a build of this
# app takes only a few minutes.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build VentureMap
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS
        run: xcodebuild -project VentureMap.xcodeproj -target VentureMap -sdk iphoneos build CODE_SIGNING_ALLOWED=NO
